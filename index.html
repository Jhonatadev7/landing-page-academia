<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academia PowerFit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Academia PowerFit</h1>
  <nav>
    <a href="#sobre">Sobre</a>
    <a href="#planos">Planos</a>
    <a href="#contato">Contato</a>
  </nav>
</header>

<section class="hero">
  <h2>Transforme seu corpo e sua vida</h2>
  <button onclick="scrollContato()">Matricule-se</button>
</section>

<section id="sobre">
  <h2>Sobre Nós</h2>
  <p>Oferecemos treinos personalizados, ambiente moderno e profissionais qualificados.</p>
</section>

<section id="planos">
  <h2>Planos</h2>
  <div class="card">Mensal - R$ 99,90</div>
  <div class="card">Trimestral - R$ 269,90</div>
  <div class="card">Anual - R$ 899,90</div>
</section>

<section id="contato">
  <h2>Contato</h2>
  <form>
    <input type="text" placeholder="Seu nome" required>
    <input type="email" placeholder="Seu email" required>
    <button type="submit">Enviar</button>
  </form>
</section>

<script src="script.js"></script>
</body>
</html>
